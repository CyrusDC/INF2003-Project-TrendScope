{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Analytical Views</h3>
    <div class="btn-group">
        <a href="?view=category_views" class="btn btn-outline-primary {% if current_view == 'category_views' %}active{% endif %}">Category Views</a>
        <a href="?view=channel_performance" class="btn btn-outline-primary {% if current_view == 'channel_performance' %}active{% endif %}">Channel Performance</a>
        <a href="?view=video_reach" class="btn btn-outline-primary {% if current_view == 'video_reach' %}active{% endif %}">Video Reach</a>
        <a href="?view=reaction_ratios" class="btn btn-outline-primary {% if current_view == 'reaction_ratios' %}active{% endif %}">Reaction Ratios</a>
    </div>
</div>
<div class="card shadow-sm p-3 mb-5 bg-white rounded">
    <div class="table-responsive">
        {{ table | safe }}
    </div>
</div>
{% endblock %}
